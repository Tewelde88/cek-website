<svg xmlns="http://www.w3.org/2000/svg" width="64" height="24" viewBox="0 0 64 24">
  <!-- Harag: interlaced band of Ge'ez manuscripts, in the site colours.
       Repeats horizontally. Red frame · ochre ground · navy strands (over/under) · alternating rosettes. -->
  <defs>
    <path id="a" d="M-32 12C-21.8 20.5-10.2 20.5 0 12C10.2 3.5 21.8 3.5 32 12C42.2 20.5 53.8 20.5 64 12C74.2 3.5 85.8 3.5 96 12"/>
    <path id="b" d="M-32 12C-21.8 3.5-10.2 3.5 0 12C10.2 20.5 21.8 20.5 32 12C42.2 3.5 53.8 3.5 64 12C74.2 20.5 85.8 20.5 96 12"/>
    <g id="strandB">
      <use href="#b" fill="none" stroke="#C1883A" stroke-width="5.4"/>
      <use href="#b" fill="none" stroke="#16315E" stroke-width="3.2"/>
      <use href="#b" fill="none" stroke="#6E8FC4" stroke-width="0.9"/>
    </g>
    <g id="strandA">
      <use href="#a" fill="none" stroke="#C1883A" stroke-width="5.4"/>
      <use href="#a" fill="none" stroke="#16315E" stroke-width="3.2"/>
      <use href="#a" fill="none" stroke="#6E8FC4" stroke-width="0.9"/>
    </g>
    <clipPath id="ends"><rect x="-1" y="0" width="7" height="24"/><rect x="58" y="0" width="7" height="24"/></clipPath>
    <g id="petals">
      <circle cx="0" cy="-3" r="1.85"/>
      <circle cx="0" cy="-3" r="1.85" transform="rotate(45)"/>
      <circle cx="0" cy="-3" r="1.85" transform="rotate(90)"/>
      <circle cx="0" cy="-3" r="1.85" transform="rotate(135)"/>
      <circle cx="0" cy="-3" r="1.85" transform="rotate(180)"/>
      <circle cx="0" cy="-3" r="1.85" transform="rotate(225)"/>
      <circle cx="0" cy="-3" r="1.85" transform="rotate(270)"/>
      <circle cx="0" cy="-3" r="1.85" transform="rotate(315)"/>
    </g>
  </defs>

  <!-- frame and ground -->
  <rect width="64" height="24" fill="#A3221B"/>
  <rect y="2.6" width="64" height="18.8" fill="#C1883A"/>
  <rect y="2.6" width="64" height=".6" fill="#7E1912" opacity=".55"/>
  <rect y="20.8" width="64" height=".6" fill="#7E1912" opacity=".55"/>

  <!-- the weave: A passes over B at the middle, B passes over A at the tile edges -->
  <use href="#strandB"/>
  <use href="#strandA"/>
  <g clip-path="url(#ends)"><use href="#strandB"/></g>

  <!-- rosettes inside the loops -->
  <g transform="translate(16 12)" fill="#A3221B" stroke="#1F1B18" stroke-width=".45">
    <use href="#petals"/>
    <circle r="1.7" fill="#F3EBDA"/>
  </g>
  <g transform="translate(48 12)" fill="#FBF6EC" stroke="#1F1B18" stroke-width=".45">
    <use href="#petals"/>
    <circle r="1.7" fill="#C1883A"/>
  </g>
</svg>
