# ==============================================================
#  ADMIN PAGE SETTINGS — Catholic Eparchy of Keren website
#  Editor: Sveltia CMS  (open the site address + /admin/)
#  Everything you save on the Admin page is stored in this GitHub
#  repository; the live website updates about 1–2 minutes later.
# ==============================================================

backend:
  name: github
  repo: Tewelde88/cek-website
  branch: main
  commit_messages:
    create: "Add {{collection}} “{{slug}}” (Admin page)"
    update: "Update {{collection}} “{{slug}}” (Admin page)"
    delete: "Delete {{collection}} “{{slug}}” (Admin page)"
    uploadMedia: "Upload “{{path}}” (Admin page)"
    deleteMedia: "Delete “{{path}}” (Admin page)"

site_url: https://tewelde88.github.io/cek-website/
display_url: https://tewelde88.github.io/cek-website/
logo_url: ../images/logo.png

# Where uploaded files go (each field below can choose its own folder)
media_folder: images/uploads
public_folder: images/uploads

# Uploads: photos are resized and converted to WebP automatically (faster pages).
# Maximum size of any uploaded file: 50 MB. For long videos use YouTube/Facebook links.
media_libraries:
  default:
    config:
      max_file_size: 52428800
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1920
          height: 1920

collections:

  # ------------------------------------------------------------
  #  NEWS & ARTICLES  (News page, Gallery, home page cards)
  # ------------------------------------------------------------
  - name: news
    label: "News & Articles"
    icon: newspaper
    description: "Post news, articles and events with photos and videos. The newest posts appear on the home page automatically."
    files:
      - name: posts
        label: "News posts"
        file: data/news.json
        fields:
          - name: posts
            label: "Posts"
            label_singular: "post"
            widget: list
            add_to_top: true
            collapsed: true
            summary: "{{fields.date}} · {{fields.title}} {{fields.title_ti}}"
            fields:
              - { name: lang, label: "Language of this post", widget: select, default: both, required: false, options: [ { label: "English and Tigrinya", value: both }, { label: "English only", value: en }, { label: "Tigrinya only — ብትግርኛ ጥራይ", value: ti } ] }
              - { name: title, label: "Title (English) — leave empty for a Tigrinya-only post", widget: string, required: false }
              - { name: title_ti, label: "Title (Tigrinya) — ኣርእስቲ ብትግርኛ", widget: string, required: false }
              - { name: id, label: "Link name", widget: string, pattern: ['^[a-z0-9-]+$', "Use small letters, numbers and dashes only, e.g. easter-2026"],
                  hint: "Short unique name used in the post’s web address, e.g. easter-2026" }
              - { name: date, label: "Date", widget: datetime, format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { name: category, label: "Category", widget: select, default: news,
                  options: [ { label: "News", value: news }, { label: "Article", value: article }, { label: "Event", value: event } ] }
              - { name: excerpt, label: "Short summary (English)", widget: text, required: false, hint: "1–2 sentences shown on the news cards" }
              - { name: excerpt_ti, label: "Short summary (Tigrinya)", widget: text, required: false }
              - { name: body, label: "Full text (English)", widget: text, required: false, hint: "Leave an empty line between paragraphs" }
              - { name: body_ti, label: "Full text (Tigrinya)", widget: text, required: false, hint: "Leave an empty line between paragraphs" }
              - { name: cover, label: "Cover photo", widget: image, required: false, media_folder: /images/news, public_folder: images/news,
                  hint: "Optional. If empty, the first gallery photo is used." }
              - name: gallery
                label: "Photo gallery"
                label_singular: "photo"
                widget: list
                required: false
                summary: "{{fields.caption}}"
                fields:
                  - { name: src, label: "Photo", widget: image, media_folder: /images/news, public_folder: images/news }
                  - { name: caption, label: "Caption (English)", widget: string, required: false }
                  - { name: caption_ti, label: "Caption (Tigrinya)", widget: string, required: false }
              - name: videos
                label: "Videos (optional)"
                label_singular: "video"
                widget: list
                required: false
                summary: "{{fields.caption}} {{fields.url}}"
                hint: "Paste a YouTube / Facebook / Vimeo link (best), OR upload a short video file (max 50 MB)."
                fields:
                  - { name: url, label: "Video link (YouTube, Facebook, Vimeo)", widget: string, required: false }
                  - { name: file, label: "…or upload a video file (MP4)", widget: file, required: false,
                      media_folder: /files/videos, public_folder: files/videos }
                  - { name: caption, label: "Caption (English)", widget: string, required: false }
                  - { name: caption_ti, label: "Caption (Tigrinya)", widget: string, required: false }
              - { name: sample, label: "Example post (shows an EXAMPLE tag)", widget: boolean, default: false, required: false }

  # ------------------------------------------------------------
  #  SERMONS  (Sermons page + home page sermon card)
  # ------------------------------------------------------------
  - name: sermons
    label: "Sermons"
    icon: record_voice_over
    description: "Add homilies with audio, video, PDF or a link."
    files:
      - name: sermons
        label: "Sermons"
        file: data/sermons.json
        fields:
          - name: sermons
            label: "Sermons"
            label_singular: "sermon"
            widget: list
            add_to_top: true
            collapsed: true
            summary: "{{fields.y}} · {{fields.t}} {{fields.ti}}"
            fields:
              - { name: lang, label: "Language of this sermon", widget: select, default: both, required: false, options: [ { label: "English and Tigrinya", value: both }, { label: "English only", value: en }, { label: "Tigrinya only — ብትግርኛ ጥራይ", value: ti } ] }
              - { name: t, label: "Title (English) — leave empty for a Tigrinya-only sermon", widget: string, required: false }
              - { name: ti, label: "Title (Tigrinya)", widget: string, required: false }
              - { name: y, label: "Year", widget: number, value_type: int }
              - { name: date, label: "Date", widget: datetime, format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false }
              - { name: by, label: "Preacher (English)", widget: string, required: false }
              - { name: by_ti, label: "Preacher (Tigrinya)", widget: string, required: false }
              - { name: audio, label: "Audio recording (MP3)", widget: file, required: false, media_folder: /files/sermons, public_folder: files/sermons }
              - { name: video, label: "Video link (YouTube / Facebook)", widget: string, required: false }
              - { name: pdf, label: "Text (PDF)", widget: file, required: false, media_folder: /files/sermons, public_folder: files/sermons }
              - { name: href, label: "Other link (optional)", widget: string, required: false }

  # ------------------------------------------------------------
  #  LIBRARY  (Library page)
  # ------------------------------------------------------------
  - name: library
    label: "Library"
    icon: menu_book
    description: "Books and documents: upload a PDF or add a web link."
    files:
      - name: items
        label: "Library items"
        file: data/library.json
        fields:
          - name: items
            label: "Items"
            label_singular: "item"
            widget: list
            add_to_top: true
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: "Title (English)", widget: string }
              - { name: title_ti, label: "Title (Tigrinya)", widget: string, required: false }
              - { name: author, label: "Author (English)", widget: string, required: false }
              - { name: author_ti, label: "Author (Tigrinya)", widget: string, required: false }
              - { name: year, label: "Year", widget: string, required: false }
              - { name: category, label: "Category", widget: select, default: eparchy,
                  options: [ { label: "Bible", value: bible }, { label: "Church Documents", value: church }, { label: "Liturgy", value: liturgy },
                             { label: "Catechesis", value: catechesis }, { label: "Social Teaching", value: social }, { label: "Eparchy Publications", value: eparchy } ] }
              - { name: lang, label: "Language", widget: string, required: false, hint: "e.g. Tigrinya, Ge'ez, English" }
              - { name: file, label: "Upload document (PDF)", widget: file, required: false, media_folder: /files/library, public_folder: files/library }
              - { name: url, label: "…or web link", widget: string, required: false }
              - { name: cover, label: "Cover picture (optional)", widget: image, required: false, media_folder: /images/library, public_folder: images/library }
              - { name: sample, label: "Example item", widget: boolean, default: false, required: false }

  # ------------------------------------------------------------
  #  EPARCHY PAGE  (priests, deaneries, religious orders)
  # ------------------------------------------------------------
  - name: eparchy
    label: "Eparchy: Bishops, Priests, Religious, History, Deaneries"
    icon: groups
    files:
      - name: eparchy
        label: "Eparchy lists"
        file: data/eparchy.json
        fields:
          - name: bishops
            label: "Bishops of Keren (shown in this order: put the current bishop first)"
            label_singular: "bishop"
            widget: list
            collapsed: true
            summary: "{{fields.name}} ({{fields.years}})"
            fields:
              - { name: name, label: "Name (English)", widget: string }
              - { name: name_ti, label: "Name (Tigrinya)", widget: string, required: false }
              - { name: years, label: "Years as bishop (e.g. 1995 – 2002)", widget: string, required: false }
              - { name: current, label: "Current bishop", widget: boolean, default: false, required: false }
              - { name: photo, label: "Photo", widget: image, required: false, media_folder: /images/bishops, public_folder: images/bishops }
              - { name: order, label: "Order (e.g. First Bishop of Keren)", widget: string, required: false }
              - { name: order_ti, label: "Order (Tigrinya)", widget: string, required: false }
              - { name: title, label: "Title (English)", widget: string, required: false, default: "Bishop of Keren" }
              - { name: title_ti, label: "Title (Tigrinya)", widget: string, required: false }
              - { name: motto, label: "Episcopal motto (English)", widget: string, required: false }
              - { name: motto_ti, label: "Episcopal motto (Ge’ez / Tigrinya)", widget: string, required: false }
              - { name: motto_sample, label: "Motto is still an example", widget: boolean, default: false, required: false }
              - { name: summary, label: "Short introduction (English)", widget: text, required: false }
              - { name: summary_ti, label: "Short introduction (Tigrinya)", widget: text, required: false }
              - name: facts
                label: "Facts (e.g. Born, Ordained priest, Died)"
                label_singular: "fact"
                widget: list
                required: false
                summary: "{{fields.label}}: {{fields.value}}"
                fields:
                  - { name: label, label: "Label (English)", widget: string }
                  - { name: label_ti, label: "Label (Tigrinya)", widget: string, required: false }
                  - { name: value, label: "Value (English)", widget: string, required: false }
                  - { name: value_ti, label: "Value (Tigrinya)", widget: string, required: false }
              - name: timeline
                label: "Year by year"
                label_singular: "year"
                widget: list
                required: false
                summary: "{{fields.years}} — {{fields.text}}"
                fields:
                  - { name: years, label: "Year(s), e.g. 1985 or 1986–1988", widget: string }
                  - { name: text, label: "What happened (English)", widget: string }
                  - { name: text_ti, label: "What happened (Tigrinya)", widget: string, required: false }
                  - { name: kind, label: "Kind", widget: select, default: ministry, options: [ { label: "Studies & formation", value: study }, { label: "Ministry", value: ministry } ] }
                  - { name: key, label: "Key moment (red dot)", widget: boolean, default: false, required: false }
              - { name: bio, label: "Biography (English) — a line starting with ## is a heading; leave an empty line between paragraphs", widget: text, required: false }
              - { name: bio_ti, label: "Biography (Tigrinya)", widget: text, required: false }
              - { name: link, label: "Page with his life (optional)", widget: string, required: false }
              - { name: sample, label: "Example entry", widget: boolean, default: false, required: false }
          - name: priests
            label: "Priests"
            label_singular: "priest"
            widget: list
            collapsed: true
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { name: name, label: "Name (English)", widget: string }
              - { name: name_ti, label: "Name (Tigrinya)", widget: string, required: false }
              - { name: role, label: "Role (English)", widget: string, required: false }
              - { name: role_ti, label: "Role (Tigrinya)", widget: string, required: false }
              - { name: place, label: "Parish / place (English)", widget: string, required: false }
              - { name: place_ti, label: "Parish / place (Tigrinya)", widget: string, required: false }
              - { name: photo, label: "Photo", widget: image, required: false, media_folder: /images/priests, public_folder: images/priests }
              - { name: ordained, label: "Date of ordination", widget: datetime, format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false }
              - { name: feast, label: "Feast day / name day (English)", widget: string, required: false }
              - { name: feast_ti, label: "Feast day / name day (Tigrinya)", widget: string, required: false }
              - { name: bio, label: "Short biography (English)", widget: text, required: false }
              - { name: bio_ti, label: "Short biography (Tigrinya)", widget: text, required: false }
              - { name: sample, label: "Example entry", widget: boolean, default: false, required: false }
          - name: deaneries
            label: "Deaneries (Keren, Habinmentel, Hagaz)"
            label_singular: "deanery"
            widget: list
            collapsed: true
            summary: "{{fields.name}} — {{fields.archpriest}}"
            fields:
              - { name: key, label: "Code (do not change: keren, habinmentel or hagaz)", widget: string }
              - { name: name, label: "Name (English)", widget: string }
              - { name: name_ti, label: "Name (Tigrinya)", widget: string, required: false }
              - { name: color, label: "Colour", widget: select, default: red, options: [ { label: "Red", value: red }, { label: "Navy", value: navy }, { label: "Ochre", value: ochre } ] }
              - { name: archpriest, label: "Archpriest (English)", widget: string, required: false }
              - { name: archpriest_ti, label: "Archpriest — ሊቀካህናት (Tigrinya)", widget: string, required: false }
              - { name: photo, label: "Archpriest photo", widget: image, required: false, media_folder: /images/deaneries, public_folder: images/deaneries }
              - { name: residence, label: "Parish where he lives (English)", widget: string, required: false }
              - { name: residence_ti, label: "Parish where he lives (Tigrinya)", widget: string, required: false }
              - { name: phone, label: "Phone (optional)", widget: string, required: false }
              - { name: about, label: "Short description (English)", widget: text, required: false }
              - { name: about_ti, label: "Short description (Tigrinya)", widget: text, required: false }
              - { name: sample, label: "Example entry", widget: boolean, default: false, required: false }
          - name: orders
            label: "Religious orders & congregations"
            label_singular: "community"
            widget: list
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: "Name (English)", widget: string }
              - { name: name_ti, label: "Name (Tigrinya)", widget: string, required: false }
              - { name: type, label: "Men or women", widget: select, options: [ { label: "Men", value: men }, { label: "Women", value: women } ], default: men }
              - { name: work, label: "Work / place (English)", widget: string, required: false }
              - { name: work_ti, label: "Work / place (Tigrinya)", widget: string, required: false }
              - { name: photo, label: "Photo", widget: image, required: false, media_folder: /images/orders, public_folder: images/orders }
              - { name: sample, label: "Example entry", widget: boolean, default: false, required: false }
          - name: about_sample
            label: "“Our story” is still an example (untick when the text is checked)"
            widget: boolean
            default: false
            required: false
          - name: about
            label: "Our story — About the Eparchy (Eparchy page, three parts: foundation, growth, commitment)"
            label_singular: "part"
            widget: list
            collapsed: true
            summary: "{{fields.label}} — {{fields.title}}"
            fields:
              - { name: label, label: "Part name (English, e.g. Foundation)", widget: string, required: false }
              - { name: label_ti, label: "Part name (Tigrinya)", widget: string, required: false }
              - { name: title, label: "Title (English)", widget: string }
              - { name: title_ti, label: "Title (Tigrinya)", widget: string, required: false }
              - { name: text, label: "Text (English) — leave an empty line between paragraphs", widget: text }
              - { name: text_ti, label: "Text (Tigrinya)", widget: text, required: false }
          - name: history
            label: "History of the Eparchy (sorted by year automatically)"
            label_singular: "year"
            widget: list
            collapsed: true
            summary: "{{fields.year}} — {{fields.title}}"
            fields:
              - { name: year, label: "Year", widget: number, value_type: int }
              - { name: date, label: "Exact date (optional — also shows the Ge’ez date)", widget: datetime, format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false }
              - { name: title, label: "Title (English)", widget: string }
              - { name: title_ti, label: "Title (Tigrinya)", widget: string, required: false }
              - { name: text, label: "Text (English)", widget: text, required: false }
              - { name: text_ti, label: "Text (Tigrinya)", widget: text, required: false }
              - { name: check, label: "Still to be checked (shows “Dates to check”)", widget: boolean, default: false, required: false }

  # ------------------------------------------------------------
  #  PARISHES & CHAPELS PAGE
  # ------------------------------------------------------------
  - name: parishes
    label: "Parishes, Chapels, Communities, Sanctuaries"
    icon: church
    files:
      - name: parishes
        label: "Parishes & chapels lists"
        file: data/parishes.json
        fields:
          - name: parishes
            label: "Parishes"
            label_singular: "parish"
            widget: list
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: "Name (English)", widget: string }
              - { name: name_ti, label: "Name (Tigrinya)", widget: string, required: false }
              - { name: patron, label: "Patron saint (English)", widget: string, required: false }
              - { name: patron_ti, label: "Patron saint (Tigrinya)", widget: string, required: false }
              - { name: deanery, label: "Deanery", widget: select, required: false, options: [ { label: "Keren — ከረን", value: keren }, { label: "Habinmentel — ሓቢንመንተል", value: habinmentel }, { label: "Hagaz — ሓጋዝ", value: hagaz } ] }
              - { name: place, label: "Town / village (English)", widget: string, required: false }
              - { name: place_ti, label: "Town / village (Tigrinya)", widget: string, required: false }
              - { name: priest, label: "Parish priest (English)", widget: string, required: false }
              - { name: priest_ti, label: "Parish priest (Tigrinya)", widget: string, required: false }
              - { name: mass, label: "Mass times (English)", widget: string, required: false }
              - { name: mass_ti, label: "Mass times (Tigrinya)", widget: string, required: false }
              - { name: phone, label: "Phone", widget: string, required: false }
              - { name: map, label: "Google Maps link", widget: string, required: false }
              - { name: sample, label: "Example entry", widget: boolean, default: false, required: false }
          - name: chapels
            label: "Chapels"
            label_singular: "chapel"
            widget: list
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - { name: deanery, label: "Deanery (leave empty to use the parish’s)", widget: select, required: false, options: [ { label: "Keren — ከረን", value: keren }, { label: "Habinmentel — ሓቢንመንተል", value: habinmentel }, { label: "Hagaz — ሓጋዝ", value: hagaz } ] }
              - { name: name, label: "Name (English)", widget: string }
              - { name: name_ti, label: "Name (Tigrinya)", widget: string, required: false }
              - { name: parish, label: "Parish (English)", widget: string, required: false }
              - { name: parish_ti, label: "Parish (Tigrinya)", widget: string, required: false }
              - { name: place, label: "Village / area (English)", widget: string, required: false }
              - { name: place_ti, label: "Village / area (Tigrinya)", widget: string, required: false }
              - { name: mass, label: "Mass times (English)", widget: string, required: false }
              - { name: mass_ti, label: "Mass times (Tigrinya)", widget: string, required: false }
              - { name: sample, label: "Example entry", widget: boolean, default: false, required: false }
          - name: communities
            label: "Small Christian communities"
            label_singular: "community"
            widget: list
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: "Name (English)", widget: string }
              - { name: name_ti, label: "Name (Tigrinya)", widget: string, required: false }
              - { name: parish, label: "Parish (English)", widget: string, required: false }
              - { name: parish_ti, label: "Parish (Tigrinya)", widget: string, required: false }
              - { name: meets, label: "When it meets (English)", widget: string, required: false }
              - { name: meets_ti, label: "When it meets (Tigrinya)", widget: string, required: false }
              - { name: sample, label: "Example entry", widget: boolean, default: false, required: false }
          - name: sanctuaries
            label: "Sanctuaries"
            label_singular: "sanctuary"
            widget: list
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - { name: deanery, label: "Deanery", widget: select, required: false, options: [ { label: "Keren — ከረን", value: keren }, { label: "Habinmentel — ሓቢንመንተል", value: habinmentel }, { label: "Hagaz — ሓጋዝ", value: hagaz } ] }
              - { name: name, label: "Name (English)", widget: string }
              - { name: name_ti, label: "Name (Tigrinya)", widget: string, required: false }
              - { name: dedication, label: "Dedication (English)", widget: string, required: false }
              - { name: dedication_ti, label: "Dedication (Tigrinya)", widget: string, required: false }
              - { name: place, label: "Town / village (English)", widget: string, required: false }
              - { name: place_ti, label: "Town / village (Tigrinya)", widget: string, required: false }
              - { name: feast, label: "Feast / pilgrimage (English)", widget: string, required: false }
              - { name: feast_ti, label: "Feast / pilgrimage (Tigrinya)", widget: string, required: false }
              - { name: map, label: "Google Maps link", widget: string, required: false }
              - { name: sample, label: "Example entry", widget: boolean, default: false, required: false }

  # ------------------------------------------------------------
  #  CONTACT DETAILS  (Contact page)
  # ------------------------------------------------------------
  - name: contact
    label: "Contact details"
    icon: contact_mail
    files:
      - name: contact
        label: "Contact details"
        file: data/contact.json
        fields:
          - { name: name, label: "Name (English)", widget: string }
          - { name: name_ti, label: "Name (Tigrinya)", widget: string, required: false }
          - { name: address, label: "Address (English)", widget: string, required: false }
          - { name: address_ti, label: "Address (Tigrinya)", widget: string, required: false }
          - { name: phone, label: "Phone", widget: string, required: false }
          - { name: email, label: "Email (the contact form sends here)", widget: string, required: false }
          - { name: whatsapp, label: "WhatsApp number (digits only, with country code, e.g. 2917123456)", widget: string, required: false }
          - { name: hours, label: "Office hours (English)", widget: string, required: false }
          - { name: hours_ti, label: "Office hours (Tigrinya)", widget: string, required: false }
          - { name: mapQuery, label: "Map location (address or place name)", widget: string, required: false }
          - name: offices
            label: "Offices"
            label_singular: "office"
            widget: list
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: "Office name (English)", widget: string }
              - { name: name_ti, label: "Office name (Tigrinya)", widget: string, required: false }
              - { name: person, label: "Person in charge (English)", widget: string, required: false }
              - { name: person_ti, label: "Person in charge (Tigrinya)", widget: string, required: false }
              - { name: phone, label: "Phone", widget: string, required: false }
              - { name: email, label: "Email", widget: string, required: false }
              - { name: link, label: "Link to a page (optional)", widget: string, required: false }
              - { name: sample, label: "Example entry", widget: boolean, default: false, required: false }

  # ------------------------------------------------------------
  #  BUILDING PROJECT  (home page block + building.html)
  # ------------------------------------------------------------
  - name: building
    label: "Building project"
    icon: construction
    description: "St. Michael’s: progress percentage, stages, story and photos."
    files:
      - name: building
        label: "St. Michael’s building project"
        file: data/building.json
        fields:
          - { name: percent, label: "Progress (%)", widget: number, value_type: int, min: 0, max: 100, hint: "The church drawing fills up to this number" }
          - { name: updated, label: "Last updated", widget: datetime, format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false }
          - { name: name, label: "Name (English)", widget: string }
          - { name: name_ti, label: "Name (Tigrinya)", widget: string, required: false }
          - { name: place, label: "Place (English)", widget: string, required: false }
          - { name: place_ti, label: "Place (Tigrinya)", widget: string, required: false }
          - { name: summary, label: "One-line summary (English)", widget: string, required: false }
          - { name: summary_ti, label: "One-line summary (Tigrinya)", widget: string, required: false }
          - { name: about, label: "About the project (English)", widget: text, required: false, hint: "Leave an empty line between paragraphs" }
          - { name: about_ti, label: "About the project (Tigrinya)", widget: text, required: false }
          - { name: stages_are_examples, label: "Stages are still examples (shows an 'Example' tag)", widget: boolean, default: false, required: false }
          - name: stages
            label: "Building stages"
            label_singular: "stage"
            widget: list
            summary: "{{fields.title}} — {{fields.status}}"
            fields:
              - { name: title, label: "Stage (English)", widget: string }
              - { name: title_ti, label: "Stage (Tigrinya)", widget: string, required: false }
              - { name: status, label: "Status", widget: select, default: planned,
                  options: [ { label: "Done", value: done }, { label: "Under way", value: current }, { label: "Next / planned", value: planned } ] }
              - { name: date, label: "Date (optional)", widget: datetime, format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false }
          - name: photos
            label: "Construction photos"
            label_singular: "photo"
            widget: list
            required: false
            summary: "{{fields.caption}}"
            fields:
              - { name: src, label: "Photo", widget: image, media_folder: /images/building, public_folder: images/building }
              - { name: caption, label: "Caption (English)", widget: string, required: false }
              - { name: caption_ti, label: "Caption (Tigrinya)", widget: string, required: false }

  # ------------------------------------------------------------
  #  PROJECTS  (projects.html — St. Michael's is added automatically
  #  from "Building project"; list the other projects here)
  # ------------------------------------------------------------
  - name: projects
    label: "Projects"
    icon: handyman
    description: "Other projects of the Eparchy (St. Michael’s is edited under “Building project”)."
    files:
      - name: projects
        label: "Projects list"
        file: data/projects.json
        fields:
          - name: projects
            label: "Projects"
            label_singular: "project"
            widget: list
            required: false
            summary: "{{fields.title}} — {{fields.percent}}%"
            fields:
              - { name: title, label: "Name (English)", widget: string }
              - { name: title_ti, label: "Name (Tigrinya)", widget: string, required: false }
              - { name: status, label: "Status", widget: select, default: current,
                  options: [ { label: "Planned", value: planned }, { label: "Under way", value: current }, { label: "Completed", value: done } ] }
              - { name: percent, label: "Progress (%)", widget: number, value_type: int, min: 0, max: 100, required: false }
              - { name: place, label: "Place (English)", widget: string, required: false }
              - { name: place_ti, label: "Place (Tigrinya)", widget: string, required: false }
              - { name: summary, label: "Short description (English)", widget: text, required: false }
              - { name: summary_ti, label: "Short description (Tigrinya)", widget: text, required: false }
              - { name: image, label: "Photo", widget: image, required: false, media_folder: /images/projects, public_folder: images/projects }
              - { name: link, label: "Link for “See the project” (optional)", widget: string, required: false }

  # ------------------------------------------------------------
  #  ANNOUNCEMENTS — the notice board on the Home page
  # ------------------------------------------------------------
  - name: announcements
    label: "Announcements"
    icon: campaign
    description: "Short announcements and latest updates for the notice board on the Home page. Pinned ones stay at the top; with a “Hide after” date an entry disappears by itself."
    files:
      - name: announcements
        label: "Notice board"
        file: data/announcements.json
        fields:
          - name: items
            label: "Announcements"
            label_singular: "announcement"
            widget: list
            required: false
            summary: "{{fields.date}} · {{fields.title}} {{fields.title_ti}}"
            fields:
              - { name: kind, label: "Kind", widget: select, default: announcement,
                  options: [ { label: "Announcement — ማስታወቂያ", value: announcement }, { label: "Update — ሓድሽ ሓበሬታ", value: update }, { label: "Event — ፍጻመ", value: event }, { label: "Urgent — ህጹጽ (red)", value: urgent } ] }
              - { name: pinned, label: "Keep at the top (pinned)", widget: boolean, default: false, required: false }
              - { name: date, label: "Date (the day of the event, or the day you post it)", widget: datetime, format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { name: until, label: "Hide after (optional)", widget: datetime, format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false, hint: "The day after this date the announcement leaves the board by itself" }
              - { name: title, label: "Title (English) — leave empty for a Tigrinya-only announcement", widget: string, required: false }
              - { name: title_ti, label: "Title (Tigrinya) — ኣርእስቲ ብትግርኛ", widget: string, required: false }
              - { name: text, label: "Short text (English)", widget: text, required: false, hint: "One to three sentences" }
              - { name: text_ti, label: "Short text (Tigrinya)", widget: text, required: false }
              - { name: link, label: "Link (optional) — a page like calendar.html, or a full web address", widget: string, required: false }
              - { name: sample, label: "Example entry (shows an EXAMPLE tag)", widget: boolean, default: false, required: false }

  # ------------------------------------------------------------
  #  QUESTIONS (FAQ) — Home page, "Questions"
  # ------------------------------------------------------------
  - name: faq
    label: "Questions (FAQ)"
    icon: help
    description: "The questions and answers on the Home page. Untick “Example” when a question is checked."
    files:
      - name: faq
        label: "Questions and answers"
        file: data/faq.json
        fields:
          - name: faqs
            label: "Questions"
            label_singular: "question"
            widget: list
            required: false
            summary: "{{fields.q}}"
            fields:
              - { name: topic, label: "Topic", widget: select, default: parish,
                  options: [ { label: "Eparchy — ኤጳርቅና", value: eparchy }, { label: "Liturgy — ሊጡርጊያ", value: liturgy }, { label: "Parish life — ህይወት ቍምስና", value: parish } ] }
              - { name: q, label: "Question (English)", widget: string }
              - { name: q_ti, label: "Question (Tigrinya)", widget: string, required: false }
              - { name: a, label: "Answer (English)", widget: text }
              - { name: a_ti, label: "Answer (Tigrinya)", widget: text, required: false }
              - { name: link, label: "“Read more” link (optional, e.g. parishes.html)", widget: string, required: false }
              - { name: sample, label: "Example entry", widget: boolean, default: false, required: false }

  # ------------------------------------------------------------
  #  NEWSLETTER — where the Home page sign-ups go (a Google Form)
  # ------------------------------------------------------------
  - name: newsletter
    label: "Newsletter"
    icon: mail
    description: "Connect the Home page sign-up box to your Google Form (see ADMIN-GUIDE, section 12)."
    files:
      - name: newsletter
        label: "Newsletter Google Form"
        file: data/newsletter.json
        fields:
          - { name: form_action, label: "Form address (ends with /formResponse)", widget: string, required: false }
          - { name: email_entry, label: "Email field code (entry.…)", widget: string, required: false }
          - { name: lang_entry, label: "Language field code (entry.…)", widget: string, required: false }

  # ------------------------------------------------------------
  #  LECTIONARY — Sunday hymn names (መዝሙር ዘያሬድ) and readings (calendar page)
  # ------------------------------------------------------------
  - name: lectionary
    label: "Lectionary (Sundays)"
    icon: menu_book
    description: "Give a Sunday its Yared hymn name, a short theme and its readings. Choose a named Sunday, or a season and the number of the Sunday in it."
    files:
      - name: lectionary
        label: "Sundays and readings"
        file: data/lectionary.json
        fields:
          - name: sundays
            label: "Sundays"
            label_singular: "Sunday"
            widget: list
            required: false
            summary: "{{fields.name}} {{fields.sunday}} {{fields.season}} {{fields.n}}"
            fields:
              - { name: sunday, label: "Named Sunday (leave empty to choose a season below)", widget: select, required: false,
                  options: [ { label: "ዘወረደ — Zewerede", value: zewerede }, { label: "ቅድስት — Qidist", value: qidist }, { label: "ምኵራብ — Mekurab", value: mekurab },
                             { label: "መጻጕዕ — Metsagu", value: metsagu }, { label: "ደብረ ዘይት — Debre Zeit", value: debrezeit }, { label: "ገብር ኄር — Gebr Her", value: gebrher },
                             { label: "ኒቆዲሞስ — Niqodimos", value: niqodimos }, { label: "ሆሳዕና — Hosanna", value: hosanna }, { label: "ፋሲካ — Easter", value: fasika },
                             { label: "ዳግም ትንሣኤ — Second Easter", value: dagim }, { label: "ጰራቅሊጦስ — Pentecost", value: pentecost } ] }
              - { name: season, label: "…or the season (ዘመን)", widget: select, required: false,
                  options: [ { label: "ዘመነ ዮሐንስ", value: yohannes }, { label: "ዘመነ መስቀል", value: meskel }, { label: "ዘመነ ጽጌ", value: tsige }, { label: "ዘመነ ስብከት", value: sibket },
                             { label: "ዘመነ ልደት", value: lidet }, { label: "ዘመነ ጥምቀት", value: timket }, { label: "ዘመነ ጾም", value: tsom }, { label: "ዘመነ ትንሣኤ", value: tinsae },
                             { label: "ዘመነ ሓዋርያት", value: hawaryat }, { label: "ዘመነ ክረምት", value: kremt } ] }
              - { name: n, label: "…and which Sunday of that season (1, 2, 3 …)", widget: number, value_type: int, min: 1, max: 20, required: false }
              - { name: name, label: "Hymn name (English or transliteration)", widget: string, required: false }
              - { name: name_ti, label: "Hymn name — መዝሙር ዘያሬድ (Ge’ez)", widget: string, required: false }
              - { name: theme, label: "Theme (English)", widget: string, required: false }
              - { name: theme_ti, label: "Theme (Tigrinya)", widget: string, required: false }
              - { name: paul, label: "Pauline epistle (e.g. Rom 13:11–14)", widget: string, required: false }
              - { name: catholic, label: "Catholic epistle", widget: string, required: false }
              - { name: acts, label: "Acts of the Apostles", widget: string, required: false }
              - { name: psalm, label: "Psalm verse — ምስባክ", widget: string, required: false }
              - { name: gospel, label: "Gospel", widget: string, required: false }
              - { name: sample, label: "Example entry (to be checked)", widget: boolean, default: false, required: false }
